<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UNIFY Mail</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--sheet:#EADFCB;--kraft:#F3E7CF;--edge:#C9B28A;--ink:#4A3B3F;--soft:#8A7A70;--acc:#E07A66;--blue:#4F91C7;--h1:#E07A66;--h2:#F0A58F;--card:#FFFBF2;--fs:100%}
[data-theme=ocean]{--acc:#2C7FB8;--h1:#2C7FB8;--h2:#6FB6E0}
[data-theme=forest]{--acc:#3F8F5B;--h1:#3F8F5B;--h2:#8CC59A}
[data-theme=berry]{--acc:#B8366B;--h1:#B8366B;--h2:#E58BB0}
[data-theme=sunset]{--acc:#E8833A;--h1:#D9534F;--h2:#F6B24C}
[data-theme=lavender]{--acc:#7B5EC4;--h1:#7B5EC4;--h2:#B9A4E8}
[data-theme=mint]{--acc:#1F9C8A;--h1:#1F9C8A;--h2:#7FDCC8}
[data-theme=slate]{--acc:#4B6277;--h1:#4B6277;--h2:#8FA6BA}
[data-theme=midnight]{--sheet:#1E2130;--kraft:#2A2E42;--edge:#434869;--ink:#EDE9F5;--soft:#A9A6C0;--acc:#8B9CFF;--blue:#7DB8F0;--h1:#2B2F55;--h2:#5A4A9C;--card:#242739}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:var(--sheet);color:var(--ink);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.chip{background:var(--kraft);border:1px solid #fff;border-radius:12px;box-shadow:0 2px 0 var(--edge);padding:.4em .8em;cursor:pointer;min-height:2.2em}
[data-theme=midnight] .chip{border-color:var(--edge)}
.chip:hover{filter:brightness(1.04)}.chip:active{transform:translateY(2px);box-shadow:none}
.chip[disabled]{opacity:.5;cursor:not-allowed}
.chip.pri{background:var(--acc);color:#fff;font-weight:600}
.chip[aria-pressed=true],.chip[aria-selected=true],.chip.on{background:var(--acc);color:#fff}
header{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:.6em 1em;display:flex;flex-wrap:wrap;gap:.6em 1em;align-items:center}
header h1{margin:0;font-size:1.4rem;font-weight:600}
header .sp{flex:1}
header select{background:rgba(255,255,255,.9);color:#4A3B3F;border:0;border-radius:10px;padding:.35em .6em;max-width:60vw}
header .chip{color:var(--ink)}
.tabs{display:flex;gap:.4em}
#app{flex:1;min-height:0;display:flex;flex-direction:column}
.card{background:var(--card);border-radius:16px;border:1px solid var(--edge);box-shadow:0 2px 0 var(--edge);padding:1.2em;max-width:30em;margin:1.5em auto;width:calc(100% - 2em)}
.card h2{margin-top:0}
.card label{display:block;margin:.7em 0 .2em;font-weight:500}
.card input,.card select,.dlg input,.dlg select,.dlg textarea,.bar input{width:100%;padding:.5em .7em;border:1px solid var(--edge);border-radius:10px;background:var(--card)}
.err{color:#B3261E;margin:.5em 0;white-space:pre-wrap}.warn{color:#9A5B00;margin:.4em 0}[data-theme=midnight] .err{color:#FF8A80}
.note{color:var(--soft);font-size:.9em}
.big{font-size:3rem;text-align:center}
.demo{background:var(--kraft);padding:.3em 1em;font-size:.9em;display:flex;gap:.6em;align-items:center;border-bottom:1px solid var(--edge)}
.bar{display:flex;gap:.5em;padding:.5em 1em;flex-wrap:wrap;align-items:center}
.bar input{flex:1;min-width:8em;width:auto}
.wrap{flex:1;min-height:0;display:grid;gap:.8em;padding:0 1em 1em}

.wrap[data-pane=bottom]{grid-template-rows:minmax(8em,1fr) minmax(8em,1.2fr)}
.wrap[data-pane=off]{grid-template-columns:1fr}
.left,.read{background:var(--card);border-radius:16px;border:1px solid var(--edge);min-height:0;display:flex;flex-direction:column;overflow:hidden}
.folders{display:flex;gap:.4em;padding:.6em;flex-wrap:wrap;border-bottom:1px solid var(--edge)}
.cnt{display:inline-block;background:var(--acc);color:#fff;border-radius:99px;padding:0 .5em;margin-left:.3em;font-size:.8em}
ul.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1}

.read{padding:1em;overflow:auto}
.read h2{margin:.2em 0}
.meta{color:var(--soft);font-size:.9em;margin:.2em 0}
.body{white-space:pre-wrap;word-break:break-word;margin:1em 0;padding:1em 0;border-top:1px dashed var(--edge)}
.acts{display:flex;gap:.4em;flex-wrap:wrap}
.empty{margin:auto;text-align:center;padding:2em;color:var(--soft)}
.empty .big{filter:drop-shadow(0 3px 0 var(--edge))}
.back{display:none}
dialog.dlg{border:1px solid var(--edge);border-radius:16px;background:var(--card);color:var(--ink);padding:1.2em;width:min(40em,96vw);max-height:94vh;overflow:auto}
dialog::backdrop{background:rgba(40,30,30,.45)}
.dlg label{display:block;margin:.6em 0 .2em;font-weight:500}
.dlg textarea{min-height:11em;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:.3em;padding:.3em;border:1px solid var(--edge);border-radius:10px}
.chips input{flex:1;min-width:10em;border:0;width:auto}
.rc{background:var(--kraft);border:1px solid var(--edge);border-radius:99px;padding:.1em .3em .1em .7em;display:inline-flex;gap:.3em;align-items:center}
.rc button{background:none;border:0;cursor:pointer;padding:0 .3em}
ul.sug{list-style:none;margin:.2em 0 0;padding:0;border:1px solid var(--edge);border-radius:10px;max-height:11em;overflow:auto}
ul.sug:empty{display:none}
ul.sug li{padding:.4em .7em;cursor:pointer}ul.sug li:hover,ul.sug li.act{background:var(--kraft)}
ul.sug li[aria-disabled=true]{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.kind{font-size:.75em;background:var(--blue);color:#fff;border-radius:6px;padding:0 .4em;margin-left:.4em}
.sw{display:flex;flex-wrap:wrap;gap:.4em}
.sw button{width:2.4em;height:2.4em;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 0 var(--edge);cursor:pointer}
.sw button[aria-pressed=true]{outline:3px solid var(--ink)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:.3em .5em;border-bottom:1px solid var(--edge)}
#toast{position:fixed;right:1em;bottom:1em;background:var(--ink);color:var(--sheet);padding:.7em 1em;border-radius:12px;box-shadow:0 3px 0 var(--edge);z-index:50}
#toast[hidden]{display:none}
.panel{padding:0 1em 1em;overflow:auto}
@media(max-width:760px){
 .wrap[data-pane]{grid-template-columns:1fr;grid-template-rows:1fr}
 .wrap .read{display:none}.wrap.reading .read{display:flex}.wrap.reading .left{display:none}
 .back{display:inline-block}
 header h1{font-size:1.15rem}
}
.wrap[data-pane=off] .read{display:none}.wrap[data-pane=off].reading .read{display:flex}.wrap[data-pane=off].reading .left{display:none}
.wrap[data-pane=off] .back{display:inline-block}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(prefers-reduced-motion:no-preference){.chip{transition:transform .1s,box-shadow .1s}#toast{animation:pop .25s}@keyframes pop{from{transform:translateY(12px);opacity:0}}}
</style>
</head>
