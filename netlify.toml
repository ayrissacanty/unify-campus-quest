# Deploy from Git: Netlify builds the game from source, then publishes dist/ and serves the news feed as a function.
[build]
  command = "npm run typecheck && npm run build && (pip install --quiet pillow || true) && python3 tools/build_netlify.py dist"
  publish = "dist"
  functions = "dist/netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/demo/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Flip Phone web app: short URL, and the service worker must always revalidate.
[[redirects]]
  from = "/phone"
  to = "/phone.html"
  status = 200

[[headers]]
  for = "/phone-sw.js"
  [headers.values]
    Cache-Control = "no-cache"
