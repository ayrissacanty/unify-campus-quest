<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>UNIFY auditorium</title>
<style>:root{--bg:rgba(255,249,240,.94);--fg:#313A3F;--bd:#9DA7AA;--on:#4F91C7}@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:rgba(49,58,63,.94);--fg:#FFF9F0}}
html,body{margin:0;height:100%;background:#F5F7F4;overflow:hidden;font-family:system-ui,sans-serif}#game{position:absolute;inset:0}
.hud{position:absolute;z-index:5;display:flex;gap:6px;flex-wrap:wrap}.hud button{border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:10px;padding:8px 11px;font-size:13px;min-height:40px;touch-action:manipulation}
.hud button.on{background:var(--on);color:#FFF9F0;border-color:var(--on)}
#top{top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px}#zoom{right:8px;bottom:calc(88px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:flex-end}
.pad{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:192px;height:192px;z-index:5;touch-action:none}.pad button{position:absolute;width:60px;height:60px;border-radius:16px;border:1.5px solid rgba(255,249,240,.7);background:rgba(49,58,63,.28);color:#FFF9F0;font-size:22px;touch-action:none}
@media(max-width:700px){.pad{transform:scale(.8);transform-origin:left bottom}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script></head>
<body><div id="game"></div>
<div class="hud" id="top"><button id="v-toggle">View</button><button id="v-free">Free look</button>
<button data-lesson="math">Math</button><button data-lesson="ela">ELA</button><button data-lesson="science">Science</button><button data-lesson="history">History</button></div>
<div class="hud" id="zoom"><button id="f-teacher">Zoom: Teacher</button><button id="f-board">Zoom: Board</button><button id="f-screen">Zoom: Projector</button><button id="f-room" class="on">Whole room</button></div>
<div class="pad"><button data-k="u" style="left:66px;top:0">▲</button><button data-k="l" style="left:0;top:66px">◀</button><button data-k="r" style="left:132px;top:66px">▶</button><button data-k="d" style="left:66px;top:132px">▼</button></div>
<script src="dist/bundle.js"></script></body></html>
