name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Database rules (run every migration and the row-level-security tests on a local Postgres)
        run: |
          sudo systemctl start postgresql
          sudo -u postgres createuser -s "$USER"
          ./supabase/tests/run_local.sh
      - name: Security and family sync regression tests
        run: node --test tests/security-sync.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build bundles
        run: npm run build
      - name: Image tool (lossless WebP; the build still works without it)
        run: pip install --quiet pillow
      - name: Build the site exactly as Netlify does (fails if a page points at a file that was not copied)
        run: python3 tools/build_netlify.py dist
      - name: Install browser for smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test (open every page in a real browser, fail on script errors)
        run: npm run test:smoke
        env:
          SMOKE_DIR: dist
      - name: Dependency audit (high and critical only; informational for now)
        run: npm audit --audit-level=high
        continue-on-error: true
