name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build (typecheck + bundles + dist)
        run: |
          npm run typecheck
          npm run build
          pip install --quiet pillow
          python3 tools/build_netlify.py dist

      - name: Deploy dist to Netlify
        run: |
          npx --yes netlify-cli@17 deploy --prod --dir=dist --functions=dist/netlify/functions \
            --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deploy dist to unify-academy-standard
        run: |
          npx --yes netlify-cli@17 deploy --prod --dir=dist --functions=dist/netlify/functions \
            --site "552096f2-8086-4ded-bb75-e9481a6fd10f" --auth "$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
