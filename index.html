<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#E07A66"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="UNIFY Academy"><link rel="manifest" href="game.webmanifest"><link rel="icon" href="phone-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNIFY Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Paper-cut shell: a cream sheet with kraft tag tabs; each game view fills the rest. */
:root{--sheet:#EADFCB;--kraft:#F3E7CF;--edge:#C9B28A;--ink:#4A3B3F;--soft:#8A7A70;--acc:#E07A66;--blue:#4F91C7;
 --ui:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sheet);color:var(--ink);font:14px/1.3 var(--ui);overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.brand{font-weight:600;letter-spacing:.5px;font-size:16px;padding:2px 4px 6px}
.brand i{font-style:normal;color:var(--acc)}
/* all action buttons live in the left side menu (grouped Go / Me / Tools); Views pull down at the top centre; the phone is a round app icon at the right edge */
#sideMenu button,#menuTab,#viewsBtn,#viewsList li,#tPhone{font:inherit;color:var(--ink);background:var(--kraft);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:5px 14px;min-height:44px;cursor:pointer;box-shadow:0 2px 0 var(--edge),0 6px 10px rgba(80,50,40,.28)}
#sideMenu button:active,#menuTab:active,#viewsBtn:active,#tPhone:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge),0 3px 6px rgba(80,50,40,.28)}
#sideMenu button.on,#viewsList li[aria-selected=true]{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 0 #b95a48,0 6px 10px rgba(80,50,40,.28)}
#sideMenu button:focus-visible,#menuTab:focus-visible,#viewsBtn:focus-visible,#tPhone:focus-visible,#viewsList:focus-visible li.act{outline:3px solid var(--blue);outline-offset:2px}
#sideMenu #leave{display:none;background:#c4463c!important;color:#fff!important;border-color:#c4463c!important;box-shadow:0 2px 0 #8f2f28,0 6px 10px rgba(80,50,40,.28)!important}
#sideMenu #leave.show{display:block}
#room{font-size:13px;color:var(--soft);min-height:0}#room:empty{display:none}
#sideMenu .grp{font-size:12px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--soft);margin:6px 2px -2px}
#sideMenu .sec{display:flex;flex-direction:column;gap:8px}#sideMenu .sec.none{display:none}
#views{position:fixed;z-index:55;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));max-width:calc(100vw - 150px)}
#views[hidden]{display:none}
#viewsBtn{display:flex;gap:6px;align-items:center;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#viewsBtn b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
#viewsList{position:absolute;left:50%;transform:translateX(-50%);top:calc(100% + 6px);min-width:200px;max-height:min(60vh,420px);overflow-y:auto;list-style:none;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--sheet);border:2px solid var(--edge);border-radius:14px;box-shadow:0 10px 24px rgba(80,50,40,.35)}
#viewsList[hidden]{display:none}#viewsList li{display:flex;align-items:center;white-space:nowrap}
#tPhone{position:fixed;z-index:55;right:calc(10px + env(safe-area-inset-right));top:50%;margin-top:-28px;width:56px;height:56px;min-height:56px;padding:0;border-radius:50%;font-size:26px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--acc);color:#fff}
#tPhone .pb{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:#c4463c;color:#fff;font-size:12px;font-weight:600;line-height:20px;text-align:center;border:2px solid #fff}#tPhone .pb:empty{display:none}
body.phone-open #tPhone,body.phone-open #views{display:none}
/* side menu: slides in from the left, hides itself 5 s after the last use (index.html script) */
#sideMenu{--mw:220px;position:fixed;z-index:60;left:0;top:0;bottom:0;width:var(--mw);max-width:80vw;display:flex;flex-direction:column;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));background:var(--sheet);border-right:2px solid var(--edge);box-shadow:6px 0 22px rgba(80,50,40,.3);overflow-y:auto;transform:translateX(-105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
body.menu-open #sideMenu{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
#sideMenu button{display:block;width:100%;text-align:left}#sideMenu button[hidden]{display:none}
#sideMenu [hidden]{display:none}
#sideMenu>*{flex-shrink:0}
#menuTab{position:fixed;z-index:61;left:env(safe-area-inset-left);top:50%;margin-top:-32px;width:34px;min-height:64px;padding:0;border-radius:0 14px 14px 0;font-size:18px;line-height:1;transition:left .25s ease,opacity .25s ease}
body.menu-open #menuTab{left:min(220px,80vw);opacity:.9}
#menuEdge{position:fixed;z-index:59;left:0;top:0;bottom:0;width:8px}
body.menu-open #menuEdge{display:none}
@media(prefers-reduced-motion:reduce){#sideMenu,body.menu-open #sideMenu,#menuTab,#tPhone{transition:none}#tPhone:active,#viewsBtn:active{transform:none}}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--sheet);display:none}
iframe.on{display:block}
#phoneWrap{position:fixed;inset:0;z-index:50;display:none;background:rgba(74,59,63,.35)}#phoneWrap.show{display:block}#phoneWrap iframe{display:block;position:absolute;inset:0;width:100%;height:100%;background:transparent}
#shotToast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;max-width:min(520px,92vw);background:var(--kraft);border:1px solid rgba(255,255,255,.8);border-radius:14px;padding:9px 16px;box-shadow:0 2px 0 var(--edge),0 8px 18px rgba(80,50,40,.3);display:none;text-align:center}
#shotToast.show{display:block}
#msg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(234,223,203,.9);z-index:3;pointer-events:none}
#msg.show{display:flex}
</style>
</head>
<body>
<button id="menuTab" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sideMenu">&#9776;</button>
<div id="menuEdge" aria-hidden="true"></div>
<nav id="sideMenu" aria-label="Academy menu">
  <span class="brand">UNIFY <i>Academy</i></span>
  <span id="room">Walk into a doorway to enter a lesson</span>
  <button id="back" hidden>← Maple Grove</button>
  <button id="leave">Leave class</button>
  <div class="sec" id="secGo" role="group" aria-labelledby="hGo"><h2 class="grp" id="hGo">Go</h2>
    <button id="tHall" class="on">Hallway</button>
    <button id="tNews">Newsroom</button>
    <button id="tMail" title="Academy mail">✉ Mail</button>
    <button id="tDesk" title="Newsroom desk: for the newsroom team" hidden>🗞 Desk</button>
    <button id="tDorm" title="My dorm: your avatar, room, grades and homework">🏠 My Dorm</button>
    <button id="tStage" title="Auditorium: live news and shows">🎭 Auditorium</button>
    <button id="tTrip" title="VR field trips">🥽 Field trips</button>
    <button id="tOpen" title="The Open Door: live classes from real teachers">🚪 Open door</button>
    <div class="dyn" data-g="go" style="display:contents"></div></div>
  <div class="sec" id="secMe" role="group" aria-labelledby="hMe"><h2 class="grp" id="hMe">Me</h2><div class="dyn" data-g="me" style="display:contents"></div></div>
  <div class="sec" id="secTools" role="group" aria-labelledby="hTools"><h2 class="grp" id="hTools">Tools</h2>
    <button id="tBeam" title="Light beam over your avatar: easy to find yourself" aria-pressed="true">💡 Light beam</button>
    <button id="tShot" title="Save a picture of school for your dorm collage (stays on this device)" aria-label="Save a screenshot of school to your dorm collage">📸 Screenshot</button>
    <div class="dyn" data-g="tools" style="display:contents"></div>
    <button id="tHelp" title="How to move around">❓ Help</button></div>
</nav>
<div id="views" hidden><button id="viewsBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="viewsList">Views: <b id="viewsCur"></b> &#9662;</button><ul id="viewsList" role="listbox" aria-label="Views" tabindex="-1" hidden></ul></div>
<button id="tPhone" type="button" title="Flip phone (P)" aria-label="Phone"><span aria-hidden="true">&#128241;</span><span class="pb" id="phoneBadge" aria-hidden="true"></span></button>
<div id="shotToast" role="status" aria-live="polite"></div>
<div id="phoneWrap"><iframe id="fPhone" title="Flip phone" allowtransparency="true" allow="fullscreen"></iframe></div>
<main>
  <iframe id="fHall" class="on" src="hallway3d.html" title="Hallway"></iframe>
  <iframe id="fNews" title="UNIFY News" allow="geolocation; autoplay"></iframe>
  <iframe id="fAud" title="Classroom"></iframe>
  <iframe id="fOpen" title="The Open Door" allow="camera; microphone; display-capture; fullscreen; autoplay"></iframe>
  <iframe id="fStage" title="Auditorium" allow="geolocation; autoplay"></iframe>
  <iframe id="fTrip" title="VR field trip" allow="gyroscope; accelerometer; autoplay; fullscreen; xr-spatial-tracking"></iframe>
  <iframe id="fMail" title="Academy mail"></iframe>
  <iframe id="fDesk" title="Newsroom desk" allow="geolocation; autoplay"></iframe>
  <iframe id="fDorm" title="My dorm" allow="fullscreen"></iframe>
  <div id="msg">Loading classroom…</div>
</main>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const F={hall:$('fHall'),news:$('fNews'),aud:$('fAud'),stage:$('fStage'),open:$('fOpen'),trip:$('fTrip'),mail:$('fMail'),desk:$('fDesk'),dorm:$('fDorm')};
const NAMES={math:'Math',ela:'ELA',science:'Science',history:'History',careers:'CarryingCareers',life:'Life Lessons',news:'Newsroom',open:'The Open Door',trip:'VR Field Trip'};
const HINT='Walk into a doorway to enter a lesson';
let pendingAtt=[],fromDoor=false,view='hall',audReady=false,pending=null,room='A',audPage='classroom3d.html',curSubject=null;
let show=function(v){
 if(view==='news'&&v!=='news'&&F.news.contentWindow)F.news.contentWindow.postMessage({type:'unify:hide'},'*');
 view=v;for(const k in F)F[k].classList.toggle('on',k===v);
 $('tHall').classList.toggle('on',v==='hall');$('tNews').classList.toggle('on',v==='news');$('tMail').classList.toggle('on',v==='mail');$('tDesk').classList.toggle('on',v==='desk');$('tDorm').classList.toggle('on',v==='dorm');
 if(v==='mail'&&!F.mail.getAttribute('src'))F.mail.src='mail.html';
 if(v==='desk'&&!F.desk.getAttribute('src'))F.desk.src='newsdesk.html';
 if(v==='dorm'&&!F.dorm.getAttribute('src'))F.dorm.src='dorm.html';
 else if(F.dorm.getAttribute('src')&&F.dorm.contentWindow)F.dorm.contentWindow.postMessage({type:'dorm:visible',on:v==='dorm'},'*');   // the dorm sets the presence room (dorm / hall) from this
 document.body.classList.toggle('cls',v==='aud');$('leave').classList.toggle('show',v==='aud'||v==='open');$('leave').textContent=v==='stage'||v==='open'||v==='trip'?'Back up to school':'Leave class';
 if(v==='open'&&!F.open.getAttribute('src'))F.open.src='opendoor.html';
 if(v==='trip'&&!F.trip.getAttribute('src'))F.trip.src='fieldtrip.html';
 if(v==='stage'){$('leave').classList.add('show');if(!F.stage.getAttribute('src'))F.stage.src='auditorium3d.html';else F.stage.contentWindow.postMessage({type:'unify:stage-show'},'*');}
 else if(view!=='stage'&&F.stage.contentWindow&&F.stage.getAttribute('src'))F.stage.contentWindow.postMessage({type:'unify:stage-hide'},'*');
 if(v==='news'){if(!F.news.getAttribute('src'))F.news.src='news.html'+location.search;else F.news.contentWindow.postMessage({type:'unify:show'},'*');}
 try{F[v].focus();F[v].contentWindow&&F[v].contentWindow.focus();}catch(e){}
};
function enter(subject,r,att){
 pendingAtt=att||[];
 room=r||'A';
 if(subject==='trip'){fromDoor=true;$('room').textContent='VR Field Trip';show('trip');return;}
 if(subject==='open'){fromDoor=true;$('room').textContent='The Open Door';show('open');return;}
 if(subject==='news'){fromDoor=true;$('room').textContent='Auditorium';show('stage');return;}
curSubject=subject;$('room').textContent=NAMES[subject]+' classroom';show('aud');
 if(!F.aud.getAttribute('src')||F.aud.getAttribute('src')!==audPage){audReady=false;pending=subject;$('msg').classList.add('show');F.aud.src=audPage;}
 else if(audReady)F.aud.contentWindow.postMessage({type:'unify:lesson',subject,attendees:pendingAtt},'*');
 else pending=subject;
}
function leave(){$('room').textContent=HINT;show('hall');F.hall.contentWindow.postMessage({type:'unify:exit',room},'*');}
addEventListener('message',e=>{
 const m=e.data;if(!m||typeof m!=='object')return;
 if(m.type==='unify:enter'&&e.source===F.hall.contentWindow)enter(m.subject,m.room,m.attendees);
 else if(m.type==='unify:open'&&m.view==='news'&&e.source===F.hall.contentWindow){$('room').textContent='';fromDoor=false;show('news');}
 else if(m.type==='unify:open'&&m.view==='trip'&&e.source===F.hall.contentWindow){fromDoor=false;$('room').textContent='VR Field Trip';show('trip');}
 else if(m.type==='unify:stage-exit'&&e.source===F.trip.contentWindow){fromDoor=false;leave();}
 else if(m.type==='unify:stage-ready'&&e.source===F.stage.contentWindow){F.stage.contentWindow.postMessage({type:'unify:stage-show'},'*');}
 else if(m.type==='unify:stage-exit'&&e.source===F.stage.contentWindow){fromDoor=false;leave();}
 else if(m.type==='unify:auditorium-ready'&&e.source===F.aud.contentWindow){audReady=true;$('msg').classList.remove('show');
  if(pending){F.aud.contentWindow.postMessage({type:'unify:lesson',subject:pending,attendees:pendingAtt},'*');pending=null;}}
});
$('tHall').onclick=()=>{$('room').textContent=HINT;show('hall');if(fromDoor){fromDoor=false;F.hall.contentWindow.postMessage({type:'unify:exit',room:'news'},'*');}};
$('tNews').onclick=()=>{$('room').textContent='';fromDoor=false;show('news');};$('leave').onclick=leave;
F.hall.addEventListener('load',()=>{try{F.hall.contentWindow.focus();}catch(e){}});
if(parent!==window){$('back').hidden=false;$('back').onclick=()=>parent.postMessage({type:'academy:exit'},'*');}   // embedded in another app (e.g. Maple Grove): offer a way back
addEventListener('keydown',e=>{if(e.key==='Escape'&&(view==='aud'||view==='stage'||view==='open'||view==='trip'))leave();});
const pw=$('phoneWrap'),pf=$('fPhone');let pfReady=false;const pfBuf=[];
function sendPhone(m){if(pfReady&&pf.contentWindow){pf.contentWindow.postMessage(m,'*');return;}if(m.type!=='phone:clock'){pfBuf.push(m);if(pfBuf.length>12)pfBuf.shift();}if(!pf.getAttribute('src'))pf.src='phone.html';}
function phone(on){on=on===undefined?!pw.classList.contains('show'):on;pw.classList.toggle('show',on);document.body.classList.toggle('phone-open',on);if(on){if(!pf.getAttribute('src'))pf.src='phone.html';else if(pfReady)pf.contentWindow.postMessage({type:'phone:open'},'*');}else try{F[view].contentWindow.focus();}catch(e){}}
$('tPhone').onclick=()=>phone();
addEventListener('message',e=>{const m=e.data;if(m&&m.type==='unify:text'&&e.source===F.hall.contentWindow)sendPhone({type:'phone:message',from:String(m.from||'').slice(0,20),text:String(m.text||'').slice(0,200),contact:null});});
addEventListener('message',e=>{const m=e.data;if(m&&m.type==='unify:clock')sendPhone({type:'phone:clock',minutes:m.minutes});});
addEventListener('message',e=>{const m=e.data;if(m&&m.type==='unify:event'&&(e.source===F.hall.contentWindow||e.source===F.aud.contentWindow)){sendPhone(Object.assign({},m,{type:'phone:event'}));}
 if(m&&m.type==='phone:badge'&&e.source===pf.contentWindow){$('phoneBadge').textContent=m.count?String(Math.min(99,m.count)):'';$('tPhone').setAttribute('aria-label',m.count?`Phone, ${m.count} unread`:'Phone');}});
setTimeout(()=>{if(!pf.getAttribute('src'))pf.src='phone.html';},1500);   // load the phone quietly so game events can reach it before it is first opened
addEventListener('message',e=>{if(e.data&&e.data.type==='phone:close'&&e.source===pf.contentWindow)phone(false);});
addEventListener('keydown',e=>{if((e.key==='p'||e.key==='P')&&!/INPUT|TEXTAREA/.test((e.target||{}).tagName||'')&&!pw.classList.contains('show')){phone(true);e.preventDefault();}});
pf.addEventListener('load',()=>{if(!pf.getAttribute('src'))return;pfReady=true;while(pfBuf.length)pf.contentWindow.postMessage(pfBuf.shift(),'*');if(pw.classList.contains('show')){pf.contentWindow.postMessage({type:'phone:open'},'*');pf.contentWindow.focus();}});
/* opening an app by name: used by the dorm computer ({type:'unify:open-app', app}) and anything else that wants to send you somewhere */
function openApp(a){
 if(a==='mail'||a==='news'||a==='desk'||a==='dorm'){$('room').textContent='';fromDoor=false;show(a);}
 else if(a==='phone'){if(!pw.classList.contains('show'))$('tPhone').click();}
 else if(a==='games'||a==='opendoor')enter('open');
}
/* light beam over your own avatar: one shared setting (localStorage unify.beam, default on); the 3D pages follow through the storage event */
(()=>{const b=$('tBeam');let on=true;try{on=localStorage.getItem('unify.beam')!=='0';}catch(e){}
 const paint=()=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',String(on));};paint();
 b.onclick=()=>{on=!on;try{localStorage.setItem('unify.beam',on?'1':'0');}catch(e){}paint();};})();
$('tDorm').onclick=()=>{$('room').textContent='';fromDoor=false;show('dorm');};
/* 📸 one frame of this tab becomes a collage picture. It is stored in the same on-device database the dorm reads (src/dorm/photos.ts) and never uploaded. */
let shotT=0;function shotToast(m){const t=$('shotToast');t.textContent=m;t.classList.add('show');clearTimeout(shotT);shotT=setTimeout(()=>t.classList.remove('show'),4200);}
function dormDb(){return new Promise((res,rej)=>{const q=indexedDB.open('unify-dorm-photos',1);q.onupgradeneeded=()=>{try{q.result.createObjectStore('photos',{keyPath:'id'});}catch(e){}};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);q.onblocked=()=>rej(new Error('blocked'));});}
async function saveShot(blob){const db=await dormDb();try{
 const n=await new Promise((res,rej)=>{const r=db.transaction('photos','readonly').objectStore('photos').count();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
 if(n>=60)throw new Error('full');
 const rec={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),at:Date.now(),kind:'screenshot',blob:blob,caption:''};
 await new Promise((res,rej)=>{const t=db.transaction('photos','readwrite');t.objectStore('photos').put(rec);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});
}finally{db.close();}}
$('tShot').onclick=async()=>{
 if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.indexedDB){shotToast("This browser can't save a picture of school. Try a computer browser, or add pictures from the dorm collage.");return;}
 let s=null;
 try{
  s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false,preferCurrentTab:true});
  const v=document.createElement('video');v.muted=true;v.playsInline=true;v.srcObject=s;await v.play();await new Promise(r=>setTimeout(r,300));
  const w=v.videoWidth,h=v.videoHeight;if(!w||!h)throw new Error('noframe');
  const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(v,0,0,c.width,c.height);
  s.getTracks().forEach(t=>t.stop());s=null;
  const blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',.82));
  await saveShot(blob);
  shotToast('📸 Saved to your dorm collage. It stays on this device.');
  try{if(F.dorm.contentWindow)F.dorm.contentWindow.postMessage({type:'dorm:photos-changed'},'*');}catch(e){}
 }catch(err){
  if(s)s.getTracks().forEach(t=>t.stop());
  shotToast(err&&err.name==='NotAllowedError'?'Okay, no picture taken.':err&&err.message==='full'?'Your collage is full (60 pictures). Delete one in My Dorm first.':"Couldn't take a picture right now. Your browser may not allow it.");
 }
};
/* apps: Mail (a separate academy-only mail app) and the Newsroom Desk (for admins and people an admin gave the app to) */
$('tMail').onclick=()=>{$('room').textContent='';fromDoor=false;show('mail');};
$('tDesk').onclick=()=>{$('room').textContent='';fromDoor=false;show('desk');};
addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;
 if(m.type==='academy:open-desk'){$('room').textContent='';fromDoor=false;show('desk');}
 else if(m.type==='unify:open-app'){openApp(m.app);}
 else if(m.type==='dorm:exit'&&e.source===F.dorm.contentWindow){$('room').textContent=HINT;fromDoor=false;show('hall');}
 else if(m.type==='mail:compose'&&e.source!==F.mail.contentWindow){show('mail');const send=()=>{try{F.mail.contentWindow.postMessage(m,'*');}catch(x){}};if(F.mail.contentDocument&&F.mail.contentDocument.readyState==='complete')send();else F.mail.addEventListener('load',send,{once:true});}
 else if(m.type==='mail:unread'&&e.source===F.mail.contentWindow)$('tMail').textContent=m.count?`✉ Mail (${m.count})`:'✉ Mail';});
addEventListener('unify:open-app',e=>{if(e.detail&&e.detail.app==='mail'||(e.data&&e.data.app==='mail')){show('mail');}});
setInterval(()=>{const l=window.__live;$('tDesk').hidden=!(l&&l.canEdit===true);if(view==='desk'&&$('tDesk').hidden)show('hall');},3000);
/* unread mail badge even before the Mail tab has been opened */
setTimeout(()=>{try{if(window.UnifyMail&&UnifyMail.watchUnread)UnifyMail.watchUnread(n=>{if(view!=='mail')$('tMail').textContent=n?`✉ Mail (${n})`:'✉ Mail';});}catch(x){}},4000);
/* side menu: tap the edge tab (or hover the left edge with a mouse) to open; closes 5 s after the last use, but never while the pointer is over it or a keyboard-focused item is in it */
(()=>{const m=$('sideMenu'),tab=$('menuTab'),edge=$('menuEdge'),body=document.body;let t=0;
 const kbFocus=()=>{const a=document.activeElement;return m.contains(a)&&a.matches(':focus-visible');};
 const arm=()=>{clearTimeout(t);if(!body.classList.contains('menu-open'))return;t=setTimeout(()=>{if(m.matches(':hover')||tab.matches(':hover')||kbFocus())arm();else set(false);},5000);};
 function set(on,focus){body.classList.toggle('menu-open',on);tab.setAttribute('aria-expanded',String(on));if(on){m.removeAttribute('inert');if(focus)$('tHall').focus();arm();}else{clearTimeout(t);if(m.contains(document.activeElement)){try{tab.focus();}catch(e){}}m.setAttribute('inert','');}}
 set(false);
 tab.addEventListener('click',()=>set(!body.classList.contains('menu-open'),true));
 edge.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')set(true);});
 edge.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')set(true);});
 for(const ev of ['pointermove','pointerdown','touchstart','keydown','focusin','click'])for(const el of [m,tab])el.addEventListener(ev,arm,{passive:true});
 m.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('button');if(b&&b.id!=='tBeam')set(false);});
 addEventListener('keydown',e=>{if(e.key==='Escape'&&body.classList.contains('menu-open')){set(false);e.stopImmediatePropagation();e.preventDefault();}},true);
})();

/* destinations and help that used to need the top bar */
$('tStage').onclick=()=>enter('news');$('tTrip').onclick=()=>enter('trip');$('tOpen').onclick=()=>enter('open');
$('tHelp').onclick=()=>shotToast('Walk with the arrow keys, WASD or the on-screen pad. Q / E turn the view. P opens the phone. Esc leaves a room.');
/* scene buttons and camera views: each embedded page (calmui.js) hides its own top button bar and publishes its buttons + views over postMessage;
   they show up here in the side menu (Go / Me / Tools) and in the Views pull-down. Only the visible frame is trusted (source + origin checked). */
const SO=location.origin==='null'?'*':location.origin;
const sceneOf={hall:F.hall,aud:F.aud,stage:F.stage,trip:F.trip},scene={};
const okOrigin=e=>location.origin==='null'||e.origin===location.origin;
addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='shell:scene'||!okOrigin(e))return;
 for(const k in sceneOf)if(e.source===sceneOf[k].contentWindow){scene[k]=m;if(k===view)renderScene();}});
function sceneMsg(m){const f=sceneOf[view];try{f&&f.contentWindow&&f.contentWindow.postMessage(m,SO);}catch(x){}}
function renderScene(){
 const d=scene[view]||{actions:[],views:null};
 for(const dyn of document.querySelectorAll('#sideMenu .dyn')){
  const g=dyn.dataset.g,items=(d.actions||[]).filter(a=>a.group===g);
  dyn.textContent='';
  for(const a of items){const b=document.createElement('button');b.type='button';b.textContent=a.label;b.hidden=!!a.hidden;if(a.pressed!=null)b.setAttribute('aria-pressed',String(a.pressed));b.onclick=()=>{sceneMsg({type:'shell:click',key:a.key});setTimeout(()=>{try{sceneOf[view].contentWindow.focus();}catch(x){}},50);};dyn.appendChild(b);}
 }
 for(const sec of document.querySelectorAll('#sideMenu .sec'))sec.classList.toggle('none',!sec.querySelector('button:not([hidden])'));
 renderViews(d.views);
}
/* Views pull-down (menu button + listbox: arrow keys, Home/End, Enter/Space, Esc) */
const vw=$('views'),vb=$('viewsBtn'),vl=$('viewsList');let vOpts=[],vAct=0;
function renderViews(v){
 const was=!vl.hidden;vOpts=v&&v.options||[];vw.hidden=!vOpts.length;
 if(!vOpts.length){closeViews(false);return;}
 const cur=vOpts.find(o=>o.id===v.current)||vOpts[0];$('viewsCur').textContent=cur.label;
 vl.textContent='';vOpts.forEach((o,i)=>{const li=document.createElement('li');li.id='vo'+i;li.setAttribute('role','option');li.setAttribute('aria-selected',String(o.id===cur.id));li.textContent=o.label;li.onclick=()=>pickView(i);vl.appendChild(li);});
 if(was)markAct(vAct);
}
function markAct(i){vAct=Math.max(0,Math.min(vOpts.length-1,i));[...vl.children].forEach((li,j)=>li.classList.toggle('act',j===vAct));vl.setAttribute('aria-activedescendant','vo'+vAct);const li=vl.children[vAct];if(li&&li.scrollIntoView)li.scrollIntoView({block:'nearest'});}
function openViews(){if(!vOpts.length)return;vl.hidden=false;vb.setAttribute('aria-expanded','true');markAct(Math.max(0,vOpts.findIndex((o,i)=>vl.children[i]&&vl.children[i].getAttribute('aria-selected')==='true')));vl.focus();}
function closeViews(back){vl.hidden=true;vb.setAttribute('aria-expanded','false');if(back)vb.focus();}
function pickView(i){const o=vOpts[i];if(!o)return;const d=scene[view];if(d&&d.views)d.views.current=o.id;sceneMsg({type:'shell:view',id:o.id});renderViews(d&&d.views);closeViews(true);setTimeout(()=>{try{sceneOf[view].contentWindow.focus();}catch(x){}},50);}
vb.onclick=()=>vl.hidden?openViews():closeViews(true);
vb.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){openViews();e.preventDefault();}});
vl.addEventListener('keydown',e=>{const k=e.key;
 if(k==='ArrowDown'){markAct(vAct+1);}else if(k==='ArrowUp'){markAct(vAct-1);}else if(k==='Home'){markAct(0);}else if(k==='End'){markAct(vOpts.length-1);}
 else if(k==='Enter'||k===' '){pickView(vAct);}else if(k==='Escape'){closeViews(true);}else if(k==='Tab'){closeViews(false);return;}else return;
 e.preventDefault();e.stopPropagation();});
document.addEventListener('pointerdown',e=>{if(!vl.hidden&&!vw.contains(e.target))closeViews(false);},true);
const origShow=show;show=function(v){origShow(v);closeViews(false);renderScene();sceneMsg({type:'shell:request'});};
for(const k in sceneOf)sceneOf[k].addEventListener('load',()=>{try{sceneOf[k].contentWindow.postMessage({type:'shell:request'},SO);}catch(x){}});
window.__academy={show,enter,leave,get view(){return view;}};
})();
</script>
