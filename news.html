<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>UNIFY News: Newsroom</title>
<script>
/* The newsroom always keeps its papercut art (the Pixar look never applies here). No WebGL, the auditorium's embedded feed (?embed=1) or ?view=2d: use the classic 2D page. */
(function(){document.documentElement.setAttribute("data-look","papercut");Array.prototype.forEach.call(document.querySelectorAll('link[href*="pixar-ui"]'),function(l){l.remove();});
var q=new URLSearchParams(location.search),gl=false;try{var c=document.createElement("canvas");gl=!!(window.WebGLRenderingContext&&(c.getContext("webgl2")||c.getContext("webgl")));}catch(e){}
if(q.get("embed")==="1"||q.get("view")==="2d"||!gl)location.replace("news2d.html"+location.search);})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
:root{--bg:#EADFCB;--panel:#F3E7CF;--fg:#4A3B3F;--mute:#8A7A70;--blue:#4F91C7;--coral:#E07A66;--lav:#8173AE;--edge:#C9B28A;--ui:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--ui);overflow:hidden}
#stage{position:fixed;inset:0}#gl{position:absolute;inset:0}
#paper,#vig{position:absolute;inset:0;pointer-events:none}#paper{mix-blend-mode:multiply;opacity:.45;background-size:256px 256px}#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 62%,rgba(96,58,52,.26) 100%)}
button{font:inherit;font-size:15px;color:var(--fg);background:var(--panel);border:1px solid rgba(255,255,255,.75);border-radius:12px;padding:6px 12px;min-height:44px;min-width:44px;cursor:pointer;box-shadow:0 2px 0 var(--edge),0 6px 10px rgba(80,50,40,.28)}
button:active{transform:translateY(2px);box-shadow:0 0 0 var(--edge)}button.on{background:var(--coral);color:#fff;border-color:var(--coral)}button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}[hidden]{display:none!important}
.top{position:absolute;z-index:5;left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;gap:8px;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}.brand{background:var(--panel);border-radius:12px;padding:6px 12px;box-shadow:0 2px 0 var(--edge),0 6px 10px rgba(80,50,40,.28);font-weight:600;font-size:15px;display:flex;gap:8px;align-items:center;min-width:0}
.brand b{background:var(--blue);color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:14px;flex:none}.brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.brand .hs,.ritem .hs{background:var(--lav);color:#fff;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.top a{color:var(--fg);font-size:13px;background:var(--panel);border-radius:10px;padding:8px 10px;text-decoration:none;box-shadow:0 2px 0 var(--edge);white-space:nowrap}
.bar{position:absolute;z-index:5;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;padding:0 8px;overflow-x:auto;scrollbar-width:none}.bar::-webkit-scrollbar{display:none}.bar button{flex:0 0 auto}
.sep{flex:0 0 6px}
.drawer{position:absolute;z-index:6;top:calc(54px + env(safe-area-inset-top,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));right:8px;width:min(330px,86vw);background:var(--panel);border-radius:14px;box-shadow:0 3px 0 var(--edge),0 12px 28px rgba(60,40,30,.4);display:flex;flex-direction:column;transform:translateX(110%);transition:transform .25s;border:1px solid rgba(255,255,255,.75)}
.drawer.open{transform:none}
.drawer h2{font-size:16px;font-weight:600;padding:10px 12px 4px;display:flex;justify-content:space-between}.drawer h2 small{color:var(--mute);font-weight:500}
#rlist{overflow:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:6px}
.ritem{display:flex;align-items:center;gap:8px;text-align:left;font-size:13px;width:100%;min-height:44px;padding:6px 8px;background:#FFF9F0;box-shadow:0 2px 0 var(--edge)}.ritem.on{background:#FBE2D8;color:var(--fg);outline:2px solid var(--coral)}
.ritem .num{flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:12px}.ritem .rt{flex:1;min-width:0;line-height:1.2}.ritem small{display:block;color:var(--mute);text-transform:capitalize;font-size:11px}
.note{position:absolute;z-index:8;inset:0;background:rgba(40,28,32,.55);display:grid;place-items:center;padding:16px}
.card{width:min(460px,94vw);max-height:80vh;overflow:auto;background:#FFF3C9;border-radius:6px;padding:18px 18px 14px;box-shadow:0 3px 0 var(--edge),0 16px 34px rgba(40,24,20,.5);transform:rotate(-.6deg)}
.card small{color:var(--mute);text-transform:uppercase;letter-spacing:.5px;font-weight:600}.card h3{font-size:22px;margin:4px 0 8px}.card p{white-space:pre-wrap;font-size:16px;line-height:1.4;margin-bottom:12px}.card .w{color:var(--mute);font-size:13px;margin-bottom:10px}
#boot{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;color:var(--mute);z-index:4}
@media(max-width:700px){.brand span{max-width:38vw}.top a{display:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="gl"></div><div id="paper"></div><div id="vig"></div>
  <div id="boot">Setting up the newsroom...</div>
  <div class="top"><div class="brand"><b>U</b><span id="nowt">UNIFY News</span><span class="hs" id="nowhs" hidden>High school</span></div><a href="news2d.html" id="classic">Classic view</a></div>
  <aside class="drawer" id="drawer" aria-label="Field reports"><h2>Field reports <small id="rcount"></small></h2><div id="rlist"></div></aside>
  <div class="bar" role="toolbar" aria-label="Newsroom controls">
    <button id="bPrev" aria-label="Previous report">⏮</button><button id="bPlay" aria-label="Pause">⏸</button><button id="bNext" aria-label="Next report">⏭</button><button id="bVoice" aria-label="Read the captions aloud" title="Read the captions aloud">🔇</button><span class="sep"></span>
    <button data-view="wide" class="on">Room</button><button data-view="screen">Screen</button><button data-view="desk">Desk</button><button data-view="board">Board</button><span class="sep"></span><button id="bList">Reports</button>
  </div>
  <div class="note" id="note" hidden><div class="card" role="dialog" aria-modal="true" aria-labelledby="noteTitle"><small id="noteKind"></small><h3 id="noteTitle"></h3><div class="w" id="noteWhen"></div><p id="noteBody"></p><button id="noteX">Close</button></div></div>
</div>
<script>
(function(){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d'),d=x.createImageData(256,256);
for(var i=0;i<d.data.length;i+=4){var v=226+Math.random()*29;d.data[i]=v;d.data[i+1]=v*.965;d.data[i+2]=v*.9;d.data[i+3]=255;}
x.putImageData(d,0,0);x.lineCap='round';for(var k=0;k<260;k++){x.strokeStyle='rgba(255,250,240,'+(.08+Math.random()*.16)+')';x.lineWidth=.6+Math.random()*.5;var px=Math.random()*256,py=Math.random()*256,a=Math.random()*6.28,l=3+Math.random()*9;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}
document.getElementById('paper').style.backgroundImage='url('+c.toDataURL()+')';})();
</script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="demo/dist/news3d.js"></script>
</body>
</html>
