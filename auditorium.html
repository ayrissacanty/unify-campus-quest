<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UNIFY Auditorium</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Paper-cut HUD shared with the hallway: kraft tags with a hard lower edge and a soft cast shadow. */
:root{--sheet:#EADFCB;--kraft:#F3E7CF;--kraft-edge:#C9B28A;--ink:#4A3B3F;--acc:#E07A66;--blue:#4F91C7;
 --ui:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sheet);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0}
#game canvas{display:block}
#paper,#vig{position:absolute;inset:0;pointer-events:none}
#paper{mix-blend-mode:multiply;opacity:.6;background-size:256px 256px;z-index:20}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(96,58,52,.28) 100%);z-index:22}
.hud{position:absolute;z-index:30;display:flex;gap:8px;flex-wrap:wrap}
.hud button,.pad button{font:inherit;font-size:14px;color:var(--ink);background:var(--kraft);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:6px 12px;min-height:38px;cursor:pointer;
 box-shadow:0 2px 0 var(--kraft-edge),0 6px 10px rgba(80,50,40,.28);touch-action:manipulation}
.hud button:active,.pad button:active{transform:translateY(2px);box-shadow:0 0 0 var(--kraft-edge),0 3px 6px rgba(80,50,40,.28)}
.hud button.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 0 #b95a48,0 6px 10px rgba(80,50,40,.28)}
.hud button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
#top{top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px}
#zoom{right:10px;bottom:calc(92px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:flex-end}
.pad{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));width:192px;height:192px;z-index:30;touch-action:none}
.pad button{position:absolute;width:58px;height:58px;padding:0;font-size:20px;border-radius:16px}
@media(max-width:700px){.pad{transform:scale(.8);transform-origin:left bottom}}
</style>
</head>
<body>
<div id="game"></div>
<div id="paper"></div><div id="vig"></div>
<div class="hud" id="top"><button id="v-toggle">View</button><button id="v-free">Free look</button>
<button data-lesson="math">Math</button><button data-lesson="ela">ELA</button><button data-lesson="science">Science</button><button data-lesson="history">History</button>
<button id="b-hand">Raise hand (H)</button><button id="b-friends">Friends</button><button id="b-avatar">Avatar</button></div>
<div class="hud" id="zoom"><button id="f-teacher">Zoom: Teacher</button><button id="f-board">Zoom: Board</button><button id="f-screen">Zoom: Projector</button><button id="f-room" class="on">Whole room</button></div>
<div class="pad"><button data-k="u" style="left:66px;top:0">&#9650;</button><button data-k="l" style="left:0;top:66px">&#9664;</button><button data-k="r" style="left:132px;top:66px">&#9654;</button><button data-k="d" style="left:66px;top:132px">&#9660;</button></div>
<script>
(function(){var c=document.createElement('canvas');c.width=c.height=256;var x=c.getContext('2d'),d=x.createImageData(256,256);
for(var i=0;i<d.data.length;i+=4){var v=226+Math.random()*29;d.data[i]=v;d.data[i+1]=v*.965;d.data[i+2]=v*.9;d.data[i+3]=255;}
x.putImageData(d,0,0);x.lineCap='round';
for(var k=0;k<260;k++){x.strokeStyle='rgba(255,250,240,'+(.08+Math.random()*.16)+')';x.lineWidth=.6+Math.random()*.5;var px=Math.random()*256,py=Math.random()*256,a=Math.random()*6.28,l=3+Math.random()*9;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.cos(a)*l,py+Math.sin(a)*l);x.stroke();}
document.getElementById('paper').style.backgroundImage='url('+c.toDataURL()+')';})();
</script>
<script src="demo/dist/bundle.js"></script>
</body>
</html>
