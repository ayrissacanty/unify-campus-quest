<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>UNIFY Classroom 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap">
<style>
/* Paper-cut HUD: kraft tags with a hard lower edge and a soft cast shadow, over a cream sheet. */
:root{--sheet:#EADFCB;--kraft:#F3E7CF;--kraft-edge:#C9B28A;--ink:#4A3B3F;--soft:#8A7A70;--acc:#E07A66;--gold:#EAB94E;--blue:#4F91C7;
 --ui:"Fredoka","Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--sheet);color:var(--ink);font-family:var(--ui);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0}
#game canvas{display:block;width:100%;height:100%}
#paper,#tint,#vig{position:absolute;inset:0;pointer-events:none}
#paper{mix-blend-mode:multiply;opacity:.6;background-size:256px 256px;z-index:20}
#tint{mix-blend-mode:multiply;z-index:21}
#vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 58%,rgba(96,58,52,.28) 100%);z-index:22}
.hud{position:absolute;z-index:30;display:flex;gap:8px;flex-wrap:wrap;align-items:center;left:10px;right:min(310px,46vw);top:calc(10px + env(safe-area-inset-top,0px))}
.tag{background:var(--kraft);border-radius:12px;padding:6px 12px;font-size:14px;box-shadow:0 2px 0 var(--kraft-edge),0 6px 10px rgba(80,50,40,.28);border:1px solid rgba(255,255,255,.7)}
.tag b{font-weight:600}
.tag .bar{display:inline-block;vertical-align:middle;margin-left:8px;width:84px;height:7px;border-radius:4px;background:rgba(74,59,63,.16);overflow:hidden}
.tag .bar i{display:block;height:100%;width:0;background:var(--acc)}
button.tag{font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:36px}
button.tag:active{transform:translateY(2px);box-shadow:0 0 0 var(--kraft-edge),0 3px 6px rgba(80,50,40,.28)}
button.tag:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hint{position:absolute;z-index:30;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px}
.rot{position:absolute;z-index:30;left:10px;bottom:calc(52px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
.rot button{width:48px;height:44px;font-size:22px;padding:0;touch-action:none}
#goMenu{position:absolute;z-index:32;left:10px;top:calc(56px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:6px;padding:10px;min-width:210px}
#goMenu.show{display:flex}
#goMenu h4{font-weight:600;font-size:13px;color:var(--soft);margin:0 2px 2px}
#goMenu button{font:inherit;font-size:15px;text-align:left;color:var(--ink);background:#FFF9F0;border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:7px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 2px 0 var(--kraft-edge)}
#goMenu button:active{transform:translateY(2px);box-shadow:none}
#goMenu button i{width:14px;height:14px;border-radius:5px;border:2px solid rgba(74,59,63,.5);display:inline-block}
#talkChip{position:absolute;z-index:33;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;background:var(--acc);color:#fff;border-color:rgba(255,255,255,.7);box-shadow:0 2px 0 #b95a48,0 6px 10px rgba(80,50,40,.28)}
#talkChip.show{display:block}
#toast{position:absolute;z-index:31;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:none;max-width:90%;text-align:center}
#toast.show{display:block}
.pad{position:absolute;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:180px;height:180px;z-index:30;touch-action:none;display:none}
@media(max-width:700px){#cnt,#bDbg,#bFriends{display:none}.tag{padding:4px 10px;font-size:13px}button.tag{min-height:32px}}
@media (pointer:coarse){.pad{display:block}.hint{display:none}.rot{bottom:calc(14px + env(safe-area-inset-bottom,0px))}}
.pad button{position:absolute;width:56px;height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.7);background:var(--kraft);box-shadow:0 2px 0 var(--kraft-edge),0 5px 8px rgba(80,50,40,.3);color:var(--ink);font-size:20px;touch-action:none}

.menu{position:absolute;z-index:36;right:10px;top:calc(56px + env(safe-area-inset-top,0px));display:none;flex-direction:column;gap:5px;padding:9px;min-width:190px}
.menu.show{display:flex}.menu h4{font-weight:600;font-size:12px;color:var(--soft);margin:0 2px 2px;text-transform:uppercase;letter-spacing:.5px}
.menu button{font:inherit;font-size:14px;text-align:left;color:var(--ink);background:#FFF9F0;border:1px solid rgba(255,255,255,.8);border-radius:9px;padding:6px 10px;cursor:pointer;box-shadow:0 2px 0 var(--kraft-edge);min-height:34px}
.menu button.on{background:var(--gold)}.menu button:active{transform:translateY(2px);box-shadow:none}.menu button[hidden]{display:none}
#moreDot{display:none;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-left:6px;vertical-align:middle}#moreDot.on{display:inline-block}
#camMenu{right:110px}
#cap{position:absolute;z-index:31;left:50%;bottom:calc(58px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(760px,92%);display:none;text-align:left;padding:10px 16px;font-size:17px;line-height:1.35;pointer-events:none}
#cap.show{display:block}#cap b{color:var(--acc);margin-right:6px}
#steps{position:absolute;z-index:30;left:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));font-size:13px;pointer-events:none}
#lessonSel{font:inherit;font-size:14px;color:var(--ink);border:1px solid rgba(255,255,255,.7);min-height:36px}
#tip{position:absolute;z-index:34;display:none;pointer-events:none;font-size:13px;padding:4px 10px}
.dimmed #vig{background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(10,14,30,.55) 100%)}
#labHost{position:absolute;inset:0;z-index:40;display:none}#labHost.show{display:block}
.lpanel{position:absolute;inset:4% 6%;background:var(--kraft);border-radius:18px;padding:16px 20px;overflow:auto;box-shadow:0 3px 0 var(--kraft-edge),0 12px 30px rgba(60,40,30,.45);border:1px solid rgba(255,255,255,.8);display:flex;flex-direction:column;gap:10px}
#labHost.show{background:rgba(40,30,30,.45)}
.lhead{display:flex;justify-content:space-between;align-items:center}.lhead h2{font-size:22px;font-weight:600}
.lbtn{font:inherit;font-size:15px;color:var(--ink);background:#FFF9F0;border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:7px 12px;cursor:pointer;box-shadow:0 2px 0 var(--kraft-edge);min-height:36px}
.lbtn:active{transform:translateY(2px);box-shadow:none}.lbtn:disabled{opacity:.5}.lbtn.big{font-size:18px;padding:10px 20px;background:var(--acc);color:#fff;align-self:flex-start}
.lpartner{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.lbtn.partner{display:flex;gap:6px;align-items:center;padding:4px 10px}.lbtn.partner canvas{width:30px;height:38px}
.lstage{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}.lcanvas{width:100%;max-width:640px;border-radius:12px;border:2px solid var(--kraft-edge);align-self:center}
.lcol{display:flex;flex-direction:column;gap:10px}.lprompt{font-size:18px;font-weight:500}.lmsg{font-size:15px;color:var(--soft)}
.lctl{display:flex;gap:16px;flex-wrap:wrap;align-items:center}.lctl label{font-size:14px;display:flex;gap:6px;align-items:center}.lctl output{min-width:24px;font-weight:600}
.lpool{display:flex;flex-wrap:wrap;gap:8px}.lcard{font:inherit;font-size:15px;background:#fff;border:2px solid var(--kraft-edge);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--ink);text-align:left}
.lcard.bad{background:#f9c9c0}.lslots{display:flex;flex-direction:column;gap:4px;padding-left:0;list-style:none}.lslot{background:rgba(255,255,255,.55);border-radius:8px;padding:5px 10px;min-height:28px;font-size:14px}.lslot.ok{background:#d6ecd6}
.lbins{display:flex;flex-wrap:wrap;gap:10px}.lbin{background:rgba(255,255,255,.6);border:2px dashed var(--kraft-edge);border-radius:12px;padding:8px;min-width:150px;display:flex;flex-direction:column;gap:6px;font-size:14px}.lbin.shake{animation:sh .3s}.lfill{font-size:12px;background:#d6ecd6;border-radius:6px;padding:2px 6px}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}.lbig{font-size:22px;font-weight:600;background:#fff;border-radius:12px;padding:14px;text-align:center}
.lpizza{align-self:center}.lslice{fill:#e9a85a;stroke:#fff6ea;stroke-width:3;cursor:pointer}.lslice:hover{fill:#f0b86a}.lslice.on{fill:#5FAE6A}.lslice:focus-visible{outline:3px solid var(--blue)}
.lswatch{width:120px;height:80px;border-radius:12px;border:3px solid var(--kraft-edge)}.lsw{display:flex;gap:16px}
.l3d{position:relative;width:100%;max-width:760px;align-self:center;border-radius:12px;overflow:hidden;border:2px solid var(--kraft-edge)}.l3d canvas{display:block;width:100%}.llabel{position:absolute;left:8px;bottom:8px;right:8px;font-size:14px;background:rgba(255,249,240,.9);border-radius:8px;padding:3px 8px;pointer-events:none;min-height:0}.llabel:empty{display:none}
.lbubble{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:#fff;border-radius:14px;padding:8px 14px;box-shadow:0 4px 12px rgba(0,0,0,.3);display:none;max-width:80%;font-size:15px}.lbubble.show{display:block}
.lresult{display:none;font-size:17px;gap:10px;align-items:center;flex-wrap:wrap}.lresult.show{display:flex}.lintro{font-size:15px;color:var(--soft)}

</style>
</head>
<body>
<div id="game"></div>
<div id="paper"></div><div id="tint"></div><div id="vig"></div>
<div class="hud">
  <span class="tag" id="lessonTag"><b id="subj">Class</b> &middot; <span id="ltitle">-</span></span>
  <button class="tag" id="bHand">&#9995; Raise hand (H)</button>
  <button class="tag" id="bSkip">Next step &#9656;</button>
  <button class="tag" id="bCam" aria-haspopup="true">&#127909; Camera &#9662;</button>
  <button class="tag" id="bMore" aria-haspopup="true">&#9776; More &#9662;<i id="moreDot"></i></button>
</div>
<div class="tag menu" id="camMenu"><h4>Camera</h4>
  <button data-cam="auto">Auto director</button><button data-cam="wide">Whole room</button><button data-cam="follow">Follow teacher</button>
  <button data-cam="board-left">Left board</button><button data-cam="board-right">Right board</button><button data-cam="screen">Projector</button>
  <button data-cam="bulletin">Bulletin board (class times)</button><button data-cam="demo">3D example</button><button data-cam="seat">My seat</button><button data-cam="free">Free orbit</button></div>
<div class="tag menu" id="moreMenu"><h4>More</h4>
  <button id="bLab">Try the 3D example</button><button id="bNext" hidden>Next lesson (get ahead)</button><button id="bExtra" hidden>Extra lesson</button><button id="bTimes">Class times</button><button id="bBook">Textbook</button><button id="bElect">Electives</button><button id="bPacks">Curriculum packs</button>
  <button id="bFriends">Friends</button><button id="bAvatar">Avatar</button><button id="bCloset">Closet (5 outfits)</button><button id="bVoice">&#128266; Voice on</button><button id="bTake">Take the new-student assessment</button><button id="bAssess">Ask new students: off</button></div>
<div class="tag" id="steps"></div>
<div class="tag" id="cap"></div><div class="tag" id="tip"></div>
<div id="labHost"></div>
<script src="demo/dist/classroom3d.js"></script>
<script src="calmui.js"></script>
</body>
</html>
